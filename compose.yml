services:
  yodmayom-web:
    build: .
    image: yodmayom-news-design:latest
    container_name: yodmayom-news-design
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    init: true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
